name: Engine rules
# Locks down the typing engine: every decided rule (DECISIONS.md) has tagged test cases,
# plus golden snapshots of typing a mixed Vietnamese/English corpus and every syllable.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the scorecard builds the engine of the commit before this change
      - name: Rules, golden snapshots, Telex lock, metrics
        run: |
          set -o pipefail
          zsh Tools/autoswitch/check.sh 2>&1 | tee check.log
      - name: Quality scorecard (job summary)
        if: always()
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 Tools/quality/scorecard.py --compare "$BASE" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 Tools/quality/scorecard.py >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the log for the PR report (.github/workflows/pr-report.yml; main's is the baseline)
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with: { name: check-log, path: check.log, retention-days: 7, if-no-files-found: ignore }
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Vikey app
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Vikey.xcodeproj -scheme Vikey -configuration Release CODE_SIGNING_ALLOWED=NO build
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS keyboard tests (correctness + performance lock)
        run: |
          brew install xcodegen
          cd iOS && xcodegen generate
          SIM=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          set -o pipefail
          TEST_RUNNER_VIKEY_CI=1 xcodebuild test -project VikeyiOS.xcodeproj -scheme Vikey -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../ios.log
      - name: Keep the test summary for the PR report
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: grep -E "Test Case .*(passed|failed)|Executed [0-9]+ tests" ios.log > ios-tests.log || true
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        with: { name: ios-log, path: ios-tests.log, retention-days: 7, if-no-files-found: ignore }
