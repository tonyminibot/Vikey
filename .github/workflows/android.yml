name: android
on:
  push:
    branches: [main, android]
    tags: ['v*']
    paths: ['Android/**', 'Engine/**', 'project.yml', '.github/workflows/android.yml']
  pull_request:
    paths: ['Android/**', 'Engine/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to upload the APK to (e.g. v1.0.16)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install the NDK and CMake the project pins (the runner ships the Android SDK + sdkmanager)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore (tags and the main/android branches only; forks build unsigned)
        if: env.KS != ''
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}", PROPS: "${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}" }
        run: |
          echo "$KS" | base64 -d > Android/release.jks
          printf '%s\n' "$PROPS" > Android/keystore.properties
          echo "storeFile=$PWD/Android/release.jks" >> Android/keystore.properties
      - name: Build
        working-directory: Android
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK by version
        run: |
          VER=$(grep MARKETING_VERSION project.yml | grep -o '"[^"]*"' | tr -d '"')
          mkdir -p out && cp Android/app/build/outputs/apk/release/app-release*.apk "out/Vikey-$VER.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" out/*.apk --clobber -R ${{ github.repository }}
