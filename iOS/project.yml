name: VikeyiOS
options:
  bundleIdPrefix: com.devuap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3H6967F79Y
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "41"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_LANGUAGE: en
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Vikey:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/VKSettings.swift
      - path: Shared/KBLog.swift
      - path: ../App/Model/Acknowledgements.swift
      - path: ../App/Model/Brand.swift
    dependencies:
      - target: VikeyKeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vikey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.devuap.vikey.ios
            CFBundleURLSchemes: [vikey]   # the keyboard's Vikey mark opens the app
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Vikey.entitlements
      properties:
        com.apple.security.application-groups: [group.com.devuap.vikey]
    settings:
      base:
        PRODUCT_NAME: Vikey
        PRODUCT_BUNDLE_IDENTIFIER: com.devuap.vikey.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VikeyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      - path: ../Engine
      - path: ../App/Model/EmojiSearch.swift
      - path: ../App/Resources/Emoji.json
        excludes:
          - "*.inc"
          - "platforms/win32.h"
          - "platforms/linux.h"
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Vikey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, vi]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/VikeyKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.devuap.vikey]
    settings:
      base:
        PRODUCT_NAME: VikeyKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: com.devuap.vikey.ios.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Keyboard-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../Engine", "$(SRCROOT)/../Engine/platforms", "$(SRCROOT)/Shared"]
        APPLICATION_EXTENSION_API_ONLY: YES
  VikeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Keyboard
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: ../App/Model/EmojiSearch.swift
      - path: ../App/Resources/Emoji.json
      - path: ../Engine
        excludes:
          - "*.inc"
          - "platforms/win32.h"
          - "platforms/linux.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devuap.vikey.ios.tests
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Keyboard-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../Engine", "$(SRCROOT)/../Engine/platforms", "$(SRCROOT)/Shared"]
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vikey:
    build:
      targets:
        Vikey: all
    test:
      targets: [VikeyTests]
